schema_version = "customs-team-workspace/v1"
workspace_root = ".."

[harness]
repository = "Audit-ai-agent/customs-engineering-harness"

[tooling]
python = "3.11"
git_minimum = "2.40"
node_major = 22
node_minimum = "22.12.0"
npm_version = "10.9.8"

[repos.frontend]
directory = "customs-frontend"
repository = "Audit-ai-agent/customs-frontend"
runtime = "npm"
quick = [["corepack", "npm", "run", "check:quick"]]
contract = [["corepack", "npm", "run", "check:contract"]]

[repos.frontend.cross_contract]
files = [
  { provider = "backend", provider_path = "docs/openapi-v1.json", consumer_path = "contracts/backend-openapi-v1.json" },
  { provider = "data_platform", provider_path = "contracts/evidence/v3/guidance_registry_v1.manifest.json", consumer_path = "contracts/evidence/v3/guidance_registry_v1.manifest.json" },
  { provider = "data_platform", provider_path = "contracts/evidence/v3/guidance_registry_v2.manifest.json", consumer_path = "contracts/evidence/v3/guidance_registry_v2.manifest.json" },
]

[repos.backend]
directory = "customs-backend"
repository = "Audit-ai-agent/customs-backend"
runtime = "uv"
setup = [["uv", "sync", "--locked", "--group", "dev", "--extra", "unit"]]
quick = [["python", "tools/check_backend.py", "quick"]]
contract = [["python", "tools/check_backend.py", "contract"]]

[repos.backend.cross_contract]
files = [
  { provider = "ai_agent", provider_path = "src/customs_ai_agent/contracts/schemas/backend/v3/review-request.schema.json", consumer_path = "src/customs_backend/contracts/agent/v3/review-request.schema.json" },
  { provider = "ai_agent", provider_path = "src/customs_ai_agent/contracts/schemas/backend/v3/review-result.schema.json", consumer_path = "src/customs_backend/contracts/agent/v3/review-result.schema.json" },
  { provider = "ai_agent", provider_path = "src/customs_ai_agent/contracts/schemas/backend/v3/assistant-answer-request.schema.json", consumer_path = "src/customs_backend/contracts/agent/v3/assistant-answer-request.schema.json" },
  { provider = "ai_agent", provider_path = "src/customs_ai_agent/contracts/schemas/backend/v3/assistant-answer-response.schema.json", consumer_path = "src/customs_backend/contracts/agent/v3/assistant-answer-response.schema.json" },
  { provider = "ai_agent", provider_path = "src/customs_ai_agent/contracts/schemas/backend/v3/knowledge-answer-request.schema.json", consumer_path = "src/customs_backend/contracts/agent/v3/knowledge-answer-request.schema.json" },
  { provider = "ai_agent", provider_path = "src/customs_ai_agent/contracts/schemas/backend/v3/knowledge-answer-response.schema.json", consumer_path = "src/customs_backend/contracts/agent/v3/knowledge-answer-response.schema.json" },
  { provider = "data_platform", provider_path = "contracts/evidence/v3/guidance_registry_v1.manifest.json", consumer_path = "src/customs_backend/contracts/evidence/v3/guidance_registry_v1.manifest.json" },
  { provider = "data_platform", provider_path = "contracts/evidence/v3/guidance_registry_v2.manifest.json", consumer_path = "src/customs_backend/contracts/evidence/v3/guidance_registry_v2.manifest.json" },
]

[repos.ai_agent]
directory = "customs-ai-agent"
repository = "Audit-ai-agent/customs-ai-agent"
runtime = "uv"
setup = [["uv", "sync", "--locked", "--group", "dev"]]
quick = [
  ["python", "-m", "ruff", "check", "src", "tests"],
  ["python", "-m", "ruff", "format", "--check", "src", "tests"],
  ["python", "-m", "mypy", "src"],
  ["python", "-m", "pytest", "-q"],
]
contract = [["python", "-m", "pytest", "-q", "tests/test_evidence_v3_consumer.py", "tests/service/test_openapi.py"]]

[repos.ai_agent.cross_contract]
files = [
  { provider = "data_platform", provider_path = "contracts/evidence/v3/rag_retrieval_v3.schema.json", consumer_path = "src/customs_ai_agent/contracts/evidence/v3/rag_retrieval_v3.schema.json" },
  { provider = "data_platform", provider_path = "contracts/evidence/v3/readiness_v3.schema.json", consumer_path = "src/customs_ai_agent/contracts/evidence/v3/readiness_v3.schema.json" },
  { provider = "data_platform", provider_path = "contracts/evidence/v3/guidance_query_v3.schema.json", consumer_path = "src/customs_ai_agent/contracts/evidence/v3/guidance_query_v3.schema.json" },
  { provider = "data_platform", provider_path = "contracts/evidence/v3/guidance_registry_v1.manifest.json", consumer_path = "src/customs_ai_agent/contracts/evidence/v3/guidance_registry_v1.manifest.json" },
  { provider = "data_platform", provider_path = "contracts/evidence/v3/guidance_registry_v2.manifest.json", consumer_path = "src/customs_ai_agent/contracts/evidence/v3/guidance_registry_v2.manifest.json" },
]

[repos.data_platform]
directory = "customs-data-platform"
repository = "Audit-ai-agent/customs-data-platform"
runtime = "uv"
setup = [["uv", "sync", "--locked", "--group", "dev"]]
quick = [
  ["uv", "run", "--locked", "--no-sync", "--group", "dev", "ruff", "format", "--check", "law_repository/src", "law_repository/tests", "tools"],
  ["uv", "run", "--locked", "--no-sync", "--group", "dev", "ruff", "check", "law_repository/src", "law_repository/tests", "tools"],
  ["uv", "run", "--locked", "--no-sync", "--group", "dev", "mypy"],
  ["uv", "run", "--locked", "--no-sync", "--group", "dev", "pytest", "-q"],
]
contract = [
  ["uv", "run", "--locked", "--no-sync", "--group", "dev", "python", "tools/check_contract_drift.py"],
]
