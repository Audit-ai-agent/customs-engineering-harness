schema_version = "4.0"
workspace_root = "../"
artifacts_dir = "../_artifacts/tasks"
secrets_dir = "../_local/secrets"

[harness]
expected_origin = "https://github.com/Audit-ai-agent/customs-engineering-harness.git"

[repos.frontend]
path = "../customs-frontend"
expected_origin = "https://github.com/Audit-ai-agent/customs-frontend.git"
quick = [["npm", "run", "check:quick"]]
contract = [["npm", "run", "check:contract"]]

[repos.backend]
path = "../customs-backend"
expected_origin = "https://github.com/Audit-ai-agent/customs-backend.git"
quick_sync = ["--extra", "unit"]
contract_sync = ["--extra", "unit"]
quick = [["python", "tools/check_backend.py", "quick"]]
contract = [["python", "tools/check_backend.py", "contract"]]

[repos.ai_agent]
path = "../customs-ai-agent"
expected_origin = "https://github.com/Audit-ai-agent/customs-ai-agent.git"
quick_sync = []
contract_sync = []
quick = [
  ["python", "-m", "ruff", "check", "src", "tests"],
  ["python", "-m", "ruff", "format", "--check", "src", "tests"],
  ["python", "-m", "mypy", "src"],
]
contract = [["python", "-m", "pytest", "-q", "tests/test_evidence_v3_consumer.py", "tests/service/test_openapi.py"]]

[repos.data_platform]
path = "../customs-data-platform"
expected_origin = "https://github.com/Audit-ai-agent/customs-data-platform.git"
expected_upstream = "https://github.com/vector2967/trade-doc-auditor.git"
expected_upstream_push = "DISABLED"
quick_sync = []
contract_sync = []
quick = [
  ["python", "-m", "ruff", "check", "law_repository/src", "law_repository/tests", "evals", "tools"],
  ["python", "-m", "mypy"],
]
contract = [
  ["python", "tools/check_contract_drift.py"],
  ["python", "-m", "pytest", "-q", "law_repository/tests/test_provider_contract.py"],
]
