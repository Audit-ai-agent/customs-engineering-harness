name: customs-local-user-uat

# Personal, loopback-only infrastructure for LOCAL USER UAT. Product services
# run from their exact active Task worktrees (TASK-0027 for the current
# scenario matrix); this file never weakens any
# repository-owned Production Compose or release gate.
services:
  operations-db:
    image: postgres@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    environment:
      POSTGRES_USER: customs_uat
      POSTGRES_PASSWORD: ${CUSTOMS_UAT_DATABASE_PASSWORD:?required}
      POSTGRES_DB: customs
    ports:
      - "127.0.0.1:${CUSTOMS_UAT_POSTGRES_PORT:-15432}:5432"
    volumes:
      - operations-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customs_uat -d customs"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [state]
    restart: unless-stopped

  identity-db:
    image: postgres@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${CUSTOMS_UAT_IDENTITY_DATABASE_PASSWORD:?required}
      POSTGRES_DB: keycloak
    volumes:
      - identity-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [identity]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak@sha256:6a7217a100bd3e5de4063a27a538ef999a3c5a88c4b4ec0ffc0a642aee7b2597
    command:
      - start-dev
      - --import-realm
      - --health-enabled=true
      - --http-enabled=true
      - --http-relative-path=/oidc
      - --hostname=${CUSTOMS_UAT_PUBLIC_ORIGIN:-http://127.0.0.1:18088}/oidc
      - --hostname-backchannel-dynamic=true
      - --proxy-headers=xforwarded
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${CUSTOMS_UAT_IDENTITY_DATABASE_PASSWORD:?required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${CUSTOMS_UAT_KEYCLOAK_ADMIN_USERNAME:?required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${CUSTOMS_UAT_KEYCLOAK_ADMIN_PASSWORD:?required}
      CUSTOMS_PUBLIC_ORIGIN: ${CUSTOMS_UAT_PUBLIC_ORIGIN:-http://127.0.0.1:18088}
    ports:
      - "127.0.0.1:${CUSTOMS_UAT_KEYCLOAK_PORT:-18082}:8080"
    volumes:
      - type: bind
        source: ${CUSTOMS_UAT_REALM_FILE:?required}
        # Keycloak requires `<realm-name>-realm.json`; the imported realm is
        # named `customs` even though the host artifact is UAT-scoped.
        target: /opt/keycloak/data/import/customs-realm.json
        read_only: true
    depends_on:
      identity-db:
        condition: service_healthy
    networks: [identity, edge]
    restart: unless-stopped

  redis:
    image: redis@sha256:b2b95679e3b46fb51864949ed25ea976fc3a6bcc00a40a1bc00d568cb2822e50
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${CUSTOMS_UAT_REDIS_PORT:-16379}:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [state]
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${CUSTOMS_UAT_MINIO_ACCESS_KEY:?required}
      MINIO_ROOT_PASSWORD: ${CUSTOMS_UAT_MINIO_SECRET_KEY:?required}
    ports:
      - "127.0.0.1:${CUSTOMS_UAT_MINIO_PORT:-19000}:9000"
      - "127.0.0.1:${CUSTOMS_UAT_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 30
    networks: [state]
    restart: unless-stopped

  frontend:
    build:
      context: ${CUSTOMS_UAT_FRONTEND_CONTEXT:?required}
      dockerfile: deploy/uat/Dockerfile
      args:
        CUSTOMS_ENHANCED_AGENT_EXPERIENCE: ${CUSTOMS_ENHANCED_AGENT_EXPERIENCE:?required}
        CUSTOMS_UAT_ADAPTIVE_ACTIVE: ${CUSTOMS_UAT_ADAPTIVE_ACTIVE:?required}
    image: customs-local-user-uat-frontend:${CUSTOMS_UAT_FRONTEND_REVISION:?required}
    environment:
      BACKEND_ORIGIN: http://host.docker.internal:${CUSTOMS_UAT_BACKEND_PORT:-18081}
      OIDC_BACKEND_ORIGIN: http://keycloak:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${CUSTOMS_UAT_FRONTEND_PORT:-18088}:5173"
    depends_on:
      keycloak:
        condition: service_started
    networks: [edge]
    restart: unless-stopped

networks:
  edge:
  identity:
    internal: true
  # Backend/worker run as exact host worktree processes in LOCAL UAT, so the
  # state services need a publish-capable bridge. Every published port above
  # remains explicitly bound to 127.0.0.1 and is not exposed to the LAN.
  state:

volumes:
  operations-db:
    name: customs_local_uat_v1_operations_db
    labels:
      customs.workspace: customs-local-user-uat
      customs.resource: operations-db
      customs.lifecycle: persistent
      customs.schema-version: "1"
  identity-db:
    name: customs_local_uat_v1_identity_db
    labels:
      customs.workspace: customs-local-user-uat
      customs.resource: identity-db
      customs.lifecycle: persistent
      customs.schema-version: "1"
  redis:
    name: customs_local_uat_v1_redis
    labels:
      customs.workspace: customs-local-user-uat
      customs.resource: redis
      customs.lifecycle: persistent
      customs.schema-version: "1"
  minio:
    name: customs_local_uat_v1_minio
    labels:
      customs.workspace: customs-local-user-uat
      customs.resource: minio
      customs.lifecycle: persistent
      customs.schema-version: "1"
