name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".gitignore"
      - ".python-version"
      - "pyproject.toml"
      - "README.md"
      - "docs/**"
      - ".github/pull_request_template.md"
      - "config/**"
      - "harness/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".gitignore"
      - ".python-version"
      - "pyproject.toml"
      - "README.md"
      - "docs/**"
      - ".github/pull_request_template.md"
      - "config/**"
      - "harness/**"

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -B -m unittest discover -s harness/tests -q
      - run: git diff --check HEAD^ HEAD
      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status -
          tar -xzf "$archive" gitleaks
      - name: Scan tracked source with redacted output
        shell: bash
        run: |
          set -euo pipefail
          scan_root="$(mktemp -d)"
          git archive --format=tar HEAD | tar -x -C "$scan_root"
          ./gitleaks dir "$scan_root" --config=config/gitleaks.toml --redact --no-banner --exit-code 1
