name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".gitleaks.toml"
      - ".gitleaksignore"
      - ".gitignore"
      - ".python-version"
      - "pyproject.toml"
      - "config/**"
      - "harness/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".gitleaks.toml"
      - ".gitleaksignore"
      - ".gitignore"
      - ".python-version"
      - "pyproject.toml"
      - "config/**"
      - "harness/**"

permissions:
  contents: read

concurrency:
  group: harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: python -B -m unittest discover -s harness/tests -q
      - run: git diff --check HEAD^ HEAD
      - name: Install pinned Gitleaks CLI
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          install -m 0755 gitleaks "$RUNNER_TEMP/gitleaks"
      - name: Scan tracked history with redacted output
        run: "$RUNNER_TEMP/gitleaks git --redact --config=config/gitleaks.toml --no-banner"
